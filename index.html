<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#06203a;overscroll-behavior:none;touch-action:none;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0}

canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}

font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;font-weight:600;font-size:clamp(20px,3.6vmin,30px);
letter-spacing:.38em;text-indent:.38em;color:rgba(255,255,255,.95);text-shadow:0 1px 10px rgba(0,25,55,.75),0 0 2px rgba(0,25,55,.5);opacity:0;transition:opacity 1.8s ease-in}
#name.show{opacity:1;transition:opacity .6s ease-out}
#dots{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:0;z-index:2}
#dots button{all:unset;box-sizing:border-box;width:30px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#dots button::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9);opacity:.38;transition:opacity .6s,transform .6s;box-shadow:0 0 6px rgba(0,30,60,.5)}
#dots button.on::before{opacity:.95;transform:scale(1.5)}
#snd{all:unset;box-sizing:border-box;position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.42;transition:opacity .4s}
#snd.on{opacity:.9}
#snd svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,30,60,.6))}
#snd .w{display:none}#snd.on .w{display:inline}#snd.on .x{display:none}

<body>
<canvas id="c"></canvas>
<div id="name"></div>
<div id="dots"></div>
<button id="snd" aria-label="サウンド"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="#fff" fill-opacity=".25"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
<script>
(()=>{'use strict';
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1));
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const _hx={};
function H2(h){let r=_hx[h];if(!r){const n=parseInt(h.slice(1),16);r=_hx[h]=[n>>16&255,n>>8&255,n&255]}return r}
function rgba(h,a){const c=H2(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(a<0?0:a>1?1:+a.toFixed(3))+')'}
function mix(a,b,t){const x=H2(a),y=H2(b);return 'rgb('+Math.round(x[0]+(y[0]-x[0])*t)+','+Math.round(x[1]+(y[1]-x[1])*t)+','+Math.round(x[2]+(y[2]-x[2])*t)+')'}
const _sh={};
function shade(h,k){const key=h+k;if(_sh[key])return _sh[key];const c=H2(h);const t=k>0?255:0,f=Math.abs(k);const r=Math.round(c[0]+(t-c[0])*f),g=Math.round(c[1]+(t-c[1])*f),b=Math.round(c[2]+(t-c[2])*f);return _sh[key]='#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);for(let i=0;i<stops.length;i+=2)g.addColorStop(stops[i],stops[i+1]);return g}
function rg(c,x,y,r0,r1,stops){const g=c.createRadialGradient(x,y,r0,x,y,r1);for(let i=0;i<stops.length;i+=2)g.addColorStop(stops[i],stops[i+1]);return g}
function mk(w,h){const e=document.createElement('canvas');e.width=Math.max(1,Math.round(w));e.height=Math.max(1,Math.round(h));return e}

/* ---------- canvas ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,U=1;
const buf=mk(2,2);let bctx=buf.getContext('2d',{alpha:false});
const CL=mk(2,2);let clx=CL.getContext('2d');
/* glow sprite */
const GLOW=mk(64,64);{const g=GLOW.getContext('2d');g.fillStyle=rg(g,32,32,0,32,[0,'rgba(255,255,255,1)',.25,'rgba(255,255,255,.45)',1,'rgba(255,255,255,0)']);g.fillRect(0,0,64,64)}
const glowCache={};
function glowSprite(col){if(glowCache[col])return glowCache[col];const e=mk(64,64),g=e.getContext('2d');g.fillStyle=rg(g,32,32,0,32,[0,rgba(col,1),.2,rgba(col,.55),.55,rgba(col,.16),1,rgba(col,0)]);g.fillRect(0,0,64,64);return glowCache[col]=e}
function glow(c,x,y,r,col,a){c.globalAlpha=a;c.drawImage(glowSprite(col),x-r,y-r,r*2,r*2);c.globalAlpha=1}

/* caustic texture (tileable) */
const CAUS=mk(128,128);let causPat=null,causPat2=null;
(function(){const g=CAUS.getContext('2d'),S=128,im=g.createImageData(S,S),d=im.data,time=3.2,MI=5,inten=.005;
for(let y=0;y<S;y++)for(let x=0;x<S;x++){const px=((x/S)*TAU*2%TAU)-250,py=((y/S)*TAU*2%TAU)-250;let ix=px,iy=py,c=1;
for(let n=0;n<MI;n++){const t=time*(1-3.5/(n+1));ix=px+Math.cos(t-ix)+Math.sin(t+iy);iy=py+Math.sin(t-iy)+Math.cos(t+ix);
c+=1/Math.hypot(px/(Math.sin(ix+t)/inten),py/(Math.cos(iy+t)/inten))}
c/=MI;c=1.17-Math.pow(c,1.4);const v=Math.pow(Math.abs(c),8);const a=clamp(v*255*1.0,0,255);const o=(y*S+x)*4;d[o]=235;d[o+1]=250;d[o+2]=255;d[o+3]=a}
g.putImageData(im,0,0)})();

/* ---------- fish geometry & drawing ---------- */
const NS=14;
const GT=new Float32Array(NS+1),GB=new Float32Array(NS+1),GS=new Float32Array(NS+1),GW=new Float32Array(NS+1);
let GL=1;
const gx=tt=>(.5-tt)*GL;
function gy(a,tt){tt=clamp(tt,0,1);const p=tt*NS,i=p|0;if(i>=NS)return a[NS];return a[i]+(a[i+1]-a[i])*(p-i)}
function prof(s,tt){
  if(tt<s.tp){const u=tt/s.tp;return Math.pow(Math.max(0,1-(1-u)*(1-u)),s.nose||.5)}
  const u=(tt-s.tp)/(1-s.tp);return s.pw+(1-s.pw)*(1-Math.pow(u,s.te||1.7))
}
function smoothPts(c,xs,ys,n,rev){
  if(!rev){for(let i=1;i<n-1;i++){c.quadraticCurveTo(xs[i],ys[i],(xs[i]+xs[i+1])/2,(ys[i]+ys[i+1])/2)}c.lineTo(xs[n-1],ys[n-1])}
  else{for(let i=n-2;i>0;i--){c.quadraticCurveTo(xs[i],ys[i],(xs[i]+xs[i-1])/2,(ys[i]+ys[i-1])/2)}c.lineTo(xs[0],ys[0])}
}
const PX=new Float32Array(NS+1);
function bodyPath(c){
  c.beginPath();c.moveTo(PX[0],GT[0]);
  for(let i=1;i<NS;i++)c.quadraticCurveTo(PX[i],GT[i],(PX[i]+PX[i+1])/2,(GT[i]+GT[i+1])/2);
  c.lineTo(PX[NS],GT[NS]);c.lineTo(PX[NS],GB[NS]);
  for(let i=NS-1;i>0;i--)c.quadraticCurveTo(PX[i],GB[i],(PX[i]+PX[i-1])/2,(GB[i]+GB[i-1])/2);
  c.closePath();
}
function band(c,a,b,col,sk,al){
  const pad=GL*.25;c.globalAlpha=al==null?1:al;c.fillStyle=col;c.beginPath();
  c.moveTo(gx(a)+sk*GL,gy(GT,a)-pad);c.lineTo(gx(b)+sk*GL,gy(GT,b)-pad);c.lineTo(gx(b)-sk*GL,gy(GB,b)+pad);c.lineTo(gx(a)-sk*GL,gy(GB,a)+pad);c.closePath();c.fill();c.globalAlpha=1;
}
function patch(c,tc,dy,rx,ry,col,al){
  c.globalAlpha=al==null?1:al;c.fillStyle=col;c.beginPath();c.ellipse(gx(tc),gy(GS,tc)+dy*gy(GW,tc),rx*GL,ry*GL,0,0,TAU);c.fill();c.globalAlpha=1;
}
function line(c,t0,t1,dy,w,col,al){
  c.globalAlpha=al==null?1:al;c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();
  for(let k=0;k<=8;k++){const tt=lerp(t0,t1,k/8),x=gx(tt),y=gy(GS,tt)+dy*gy(GW,tt);k?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.globalAlpha=1;
}
function scalesPat(c,col,al,sz,t0,t1){
  c.strokeStyle=col;c.globalAlpha=al;c.lineWidth=.8;c.beginPath();
  const dx=sz*GL,rows=5;let row=0;
  for(let r=-rows;r<=rows;r++,row++){
    for(let tt=t0+((row&1)?dx/GL*.5:0);tt<t1;tt+=dx/GL){const x=gx(tt),y=gy(GS,tt)+r*gy(GW,tt)/rows*.95;if(Math.abs(r)/rows>.97)continue;c.moveTo(x+dx*.45,y-dx*.55);c.arc(x,y,dx*.55,-1,1,false)}
  }
  c.stroke();c.globalAlpha=1;
}
const QP=(a,b,cc,t)=>(1-t)*(1-t)*a+2*(1-t)*t*b+t*t*cc;
function finEdge(P0,Tip,P1,out){
  out.length=0;const c1x=lerp(P0[0],Tip[0],.5),c1y=lerp(P0[1],Tip[1],.85),c2x=lerp(Tip[0],P1[0],.62),c2y=lerp(Tip[1],P1[1],.86);
  for(let k=0;k<=7;k++){const t=k/7;out.push([QP(P0[0],c1x,Tip[0],t),QP(P0[1],c1y,Tip[1],t)])}
  for(let k=1;k<=7;k++){const t=k/7;out.push([QP(Tip[0],c2x,P1[0],t),QP(Tip[1],c2y,P1[1],t)])}
}
const FE=[],TP=[];
function fillFin(c,pts,col,al,rays,base){
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();
  c.fillStyle=rgba(col,al);c.fill();
  if(rays){c.strokeStyle=rgba(shade(col,-.35),.28);c.lineWidth=.7;c.beginPath();const n=pts.length;
    for(let j=1;j<=rays;j++){const k=Math.round(j/(rays+1)*(n-1));c.moveTo(base[0]+(base[2]-base[0])*j/(rays+1),base[1]+(base[3]-base[1])*j/(rays+1));c.lineTo(pts[k][0],pts[k][1])}c.stroke()}
  c.strokeStyle=rgba(shade(col,-.4),.3);c.lineWidth=.8;c.stroke();
}
function drawFish(c,f,t,u){
  const s=f.sp,L=s.L*u*f.sc;GL=L;
  const ph=f.ph,amp=f.amp,wl=s.wl||.75,Hm=s.H*L,ta=s.ta||1,ba=s.ba||1;
  for(let i=0;i<=NS;i++){
    const tt=i/NS,w=prof(s,tt)*Hm,off=amp*L*Math.sin(ph-tt*TAU*wl)*(.05+.95*tt*tt);
    PX[i]=gx(tt);GS[i]=off;GW[i]=w;GT[i]=off-w*ta;GB[i]=off+w*ba;
  }
  const flipv=f.flip;
  c.save();c.translate(f.x,f.y);c.rotate(f.tilt*flipv);c.scale(flipv,1);
  /* tail */
  const T=s.tail,TL=T.len*L,TH=T.h*L,x0=gx(1),yS=GS[NS],wT=GW[NS];
  const swp=amp*L*1.35*Math.sin(ph-TAU*wl-.75);
  TP.length=0;TP.push([x0+3,yS-wT*.9]);
  for(let k=0;k<=10;k++){
    const v=-1+k/5,av=Math.abs(v);let e;
    if(T.t==='round')e=.5+.5*Math.sqrt(1-av*av);else if(T.t==='flow')e=1-T.fk*(1-Math.pow(av,1.3));else e=1-T.fk*(1-Math.pow(av,1.5));
    const ex=TL*e,rr=ex/TL;
    let y=yS+v*TH*(1-.1*Math.abs(swp)/TH)+swp*rr*1.05;
    if(T.t==='flow')y+=Math.sin(ph*1.25+v*3.4+rr*2.6)*.045*L*rr;
    TP.push([x0-ex*(1-.12*Math.abs(swp)/(TH+1)),y]);
  }
  TP.push([x0+3,yS+wT*.9]);
  {const g=lg(c,x0,0,x0-TL,0,[0,rgba(T.col,.92),.6,rgba(T.col,T.a||.72),1,rgba(T.col2||T.col,T.a2||.5)]);
   c.beginPath();c.moveTo(TP[0][0],TP[0][1]);for(let i=1;i<TP.length;i++)c.lineTo(TP[i][0],TP[i][1]);c.closePath();c.fillStyle=g;c.fill();
   c.strokeStyle=rgba(shade(T.col,-.4),.35);c.lineWidth=.8;c.stroke();
   c.strokeStyle=rgba(shade(T.col,-.45),.25);c.lineWidth=.7;c.beginPath();for(let i=2;i<TP.length-2;i+=1){c.moveTo(x0,yS);c.lineTo(TP[i][0],TP[i][1])}c.stroke();
   if(T.edge){c.strokeStyle=rgba(T.edge,.55);c.lineWidth=1.6;c.beginPath();c.moveTo(TP[1][0],TP[1][1]);for(let i=2;i<TP.length-1;i++)c.lineTo(TP[i][0],TP[i][1]);c.stroke()}}
  /* dorsal / anal / pelvic */
  const sway=Math.sin(t*1.7+f.id)*.012*L;
  function fin(F,sign,al){
    if(!F)return;const A=sign<0?GT:GB;
    const P0=[gx(F.a),gy(A,F.a)+sign*GL*.004],P1=[gx(F.b),gy(A,F.b)+sign*GL*.004];
    const tt=Math.min(F.tt,1),Tip=[gx(F.tt)+sway,gy(A,tt)+sign*F.h*L];
    finEdge(P0,Tip,P1,FE);fillFin(c,FE,F.col,al||.85,5,[P0[0],P0[1],P1[0],P1[1]]);
  }
  fin(s.dor,-1);fin(s.anal,1);
  if(s.pelv){const P=s.pelv,b0=[gx(P.t-.035),gy(GB,P.t-.035)],b1=[gx(P.t+.035),gy(GB,P.t+.035)];
    const tip=[gx(P.t+(P.back||.1))+sway*2,gy(GB,P.t)+P.len*L];finEdge(b0,tip,b1,FE);fillFin(c,FE,P.col,.8,0,null)}
  if(s.pre)s.pre(c,f,t);
  /* body */
  bodyPath(c);
  {const C=s.c;c.fillStyle=lg(c,0,-Hm*ta,0,Hm*ba,[0,f.cc?f.cc[0]:C[0],.5,f.cc?f.cc[1]:C[1],1,f.cc?f.cc[2]:C[2]]);c.fill()}
  c.save();c.clip();
  if(s.pat)s.pat(c,f,t);
  /* shading */
  c.lineCap='round';c.lineJoin='round';
  const wmax=Hm*.5+GW[5]*.5;
  c.strokeStyle='rgba(255,255,255,'+(s.gloss==null?.2:s.gloss)+')';c.lineWidth=Hm*.34;c.beginPath();
  for(let k=0;k<=8;k++){const tt=lerp(.1,.8,k/8);k?c.lineTo(gx(tt),gy(GS,tt)-gy(GW,tt)*.62):c.moveTo(gx(tt),gy(GS,tt)-gy(GW,tt)*.62)}c.stroke();
  c.strokeStyle='rgba(0,10,30,.14)';c.lineWidth=Hm*.55;c.beginPath();
  for(let k=0;k<=8;k++){const tt=lerp(.08,.95,k/8);k?c.lineTo(gx(tt),gy(GS,tt)+gy(GW,tt)*1.15):c.moveTo(gx(tt),gy(GS,tt)+gy(GW,tt)*1.15)}c.stroke();
  bodyPath(c);c.strokeStyle='rgba(0,10,30,.22)';c.lineWidth=2.4;c.stroke();
  c.restore();
  bodyPath(c);c.strokeStyle=rgba(shade(s.c[1],-.55),.38);c.lineWidth=.9;c.stroke();
  /* gill + mouth */
  const tg=s.gill||.25;c.strokeStyle='rgba(0,10,30,.22)';c.lineWidth=Math.max(.8,L*.012);c.beginPath();
  c.moveTo(gx(tg)+L*.012,gy(GT,tg)+gy(GW,tg)*.22);c.quadraticCurveTo(gx(tg)-L*.03,gy(GS,tg),gx(tg)+L*.012,gy(GB,tg)-gy(GW,tg)*.25);c.stroke();
  if(s.post)s.post(c,f,t);
  /* eye */
  const E=s.eye,et=E.t,ex=gx(et),ey=gy(GS,et)+E.y*gy(GW,et),er=E.r*L;
  c.fillStyle=E.ring||'rgba(255,255,255,.9)';c.beginPath();c.arc(ex,ey,er*1.18,0,TAU);c.fill();
  c.fillStyle=E.iris||'#d8a030';c.beginPath();c.arc(ex,ey,er*1.0,0,TAU);c.fill();
  c.fillStyle='#07101c';c.beginPath();c.arc(ex+er*.06,ey,er*.66,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,.95)';c.beginPath();c.arc(ex+er*.3,ey-er*.32,er*.28,0,TAU);c.fill();
  /* pectoral */
  if(s.pect){const P=s.pect,fl=Math.sin(ph*.55+f.id)*.28+f.flick*.4;
    c.save();c.translate(gx(P.t),gy(GS,P.t)+gy(GW,P.t)*.25);c.rotate(PI-.38+fl);
    const pl=P.len*L,pw=P.len*L*.36;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(pl*.3,-pw,pl*.8,-pw*.9,pl,-pw*.1);c.bezierCurveTo(pl*.85,pw*.5,pl*.4,pw*.55,0,pw*.1);c.closePath();
    c.fillStyle=rgba(P.col,.5);c.fill();c.strokeStyle=rgba(shade(P.col,-.4),.3);c.lineWidth=.7;c.stroke();c.restore()}
  c.restore();
}

/* ---------- species ---------- */
const TAILS={};
const SP={};
function sp(name,o){SP[name]=o;return o}
sp('clown',{L:58,H:.2,tp:.4,pw:.2,te:1.6,c:['#ff5a08','#ff8a26','#ffb447'],tail:{t:'round',len:.25,h:.26,col:'#ff7416',edge:'#111'},
  dor:{a:.14,b:.78,h:.17,tt:.5,col:'#ff7416'},anal:{a:.6,b:.82,h:.11,tt:.7,col:'#ff7416'},pelv:{t:.36,len:.15,col:'#ff7416'},pect:{t:.3,len:.2,col:'#ff9a3a'},
  eye:{t:.12,r:.05,y:-.1,iris:'#e0a020'},spd:20,
  pat(c){for(const[a,b]of[[.19,.29],[.46,.6],[.83,.93]]){band(c,a-.018,b+.018,'#16110f',.015,1);band(c,a,b,'#fdfaf4',.015,1)}}});
sp('tang',{L:84,H:.27,tp:.42,pw:.11,te:1.4,c:['#164fd4','#2b82f5','#74bbff'],tail:{t:'fork',len:.28,h:.3,fk:.45,col:'#ffd218',edge:'#f5b800'},
  dor:{a:.17,b:.9,h:.17,tt:.6,col:'#1f5be0'},anal:{a:.55,b:.9,h:.14,tt:.75,col:'#1f5be0'},pelv:{t:.4,len:.12,col:'#ffd218'},pect:{t:.3,len:.2,col:'#ffd218'},
  eye:{t:.13,r:.037,y:-.04,iris:'#222'},spd:28,
  pat(c){
    c.fillStyle='#0b1a4a';c.beginPath();c.moveTo(gx(.3),gy(GT,.3)-6);c.lineTo(gx(.97),gy(GT,.97)-6);c.lineTo(gx(.99),gy(GS,.99));
    c.bezierCurveTo(gx(.82),gy(GS,.8)+gy(GW,.8)*.7,gx(.62),gy(GS,.6)+gy(GW,.6)*.1,gx(.48),gy(GS,.5)-gy(GW,.5)*.1);
    c.bezierCurveTo(gx(.5),gy(GS,.45)+gy(GW,.45)*.35,gx(.4),gy(GS,.4)+gy(GW,.4)*.2,gx(.3),gy(GS,.3)-gy(GW,.3)*.5);c.closePath();c.fill();
    c.strokeStyle='rgba(120,200,255,.25)';c.lineWidth=1;c.stroke();

let fid=0;
function mkFish(w,key,o){
  o=o||{};const s=SP[key];
  const f={kind:'fish',sp:s,id:fid++*1.7,sc:o.sc||rnd(.92,1.08),z:o.z==null?rnd(.75,1):o.z,
    x:o.x!=null?o.x*W:rnd(.15,.85)*W,y:o.y!=null?o.y*H:lerp(w.top,w.bot,rnd(.15,.85)),vx:0,vy:0,
    wa:rnd(0,TAU),wt:rnd(1,6),py:0,pt:0,flip:Math.random()<.5?-1:1,facT:0,tilt:0,ph:rnd(0,TAU),amp:.04,flick:0,spdv:o.spd||rnd(.88,1.12),
    sch:o.sch||null,home:o.home||null,bt:rnd(15,40),clamp:0,bounds:o.bounds||null,cc:o.cc||null,pp:o.pp||null,floor:o.floor||0};
  f.facT=f.flip;const sp0=s.spd*U*f.spdv;f.vx=f.facT*sp0*.6;f.vy=rnd(-.1,.1)*sp0;f.py=f.y;
  return f;
}
function fishRadius(f){return f.sp.L*U*f.sc*.55}
function fishUpdate(f,dt,w){
  const s=f.sp,L=s.L*U*f.sc,spd=s.spd*U*f.spdv*(f.floor?1:1);
  const top=w.top+L*s.H*.9+4,bot=(f.floor?w.floorMin+8*U:w.bot)-L*s.H*.9;
  /* wander */
  const S=f.sch;
  f.wt-=dt;
  if(f.wt<=0){f.wt=rnd(5,12);if(!S){f.wa=Math.random()<.6?(f.facT>0?0:PI)+rnd(-1,1):rnd(0,TAU)}}
  if(S){S.t-=dt;if(S.t<=0&&S.lead===f){S.t=rnd(6,14);S.wa=Math.random()<.55?(S.wa>PI/2&&S.wa<PI*1.5?0:PI)+rnd(-1,1):rnd(0,TAU)}}
  f.pt-=dt;if(f.pt<=0){f.pt=rnd(10,24);f.py=lerp(top,bot,rnd(.05,.95))}
  const mx=Math.max(W*.08,L*.8+spd*1.7),my=Math.max(H*.05,L*.25+spd*.8);
  {let a=S?S.wa:f.wa;const cx=Math.cos(a),sy=Math.sin(a);
   if((f.x<mx&&cx<0)||(f.x>W-mx&&cx>0))a=PI-a;
   if((f.y<top+my&&sy<0)||(f.y>bot-my&&sy>0))a=-a;
   if(S){if(S.lead===f)S.wa=a}else f.wa=a}
  const wa=S?S.wa:f.wa;
  let dx=Math.cos(wa),dy=Math.sin(wa)*.45+clamp((f.py-f.y)/(H*.25),-1,1)*.55;
  if(f.home){const hx=f.home.x*W,hy=f.home.y*H,R=f.home.r*U,d=Math.hypot(f.x-hx,f.y-hy);if(d>R){const k=(d-R)/R*1.6+.3;dx+=(hx-f.x)/d*k;dy+=(hy-f.y)/d*k}}
  if(f.x<mx)dx+=(1-f.x/mx)*3.4;else if(f.x>W-mx)dx-=(1-(W-f.x)/mx)*3.4;
  if(f.y<top+my)dy+=(1-(f.y-top)/my)*3;else if(f.y>bot-my)dy-=(1-(bot-f.y)/my)*3;
  /* separation + school */
  for(const g of w.cr){if(g===f||g.kind!=='fish')continue;const ddx=f.x-g.x,ddy=f.y-g.y,d=Math.hypot(ddx,ddy)||1;
    const r=(s.L*f.sc+g.sp.L*g.sc)*U*(g.sch&&g.sch===S?.45:.62);
    if(d<r){const k=(1-d/r)*1.6;dx+=ddx/d*k;dy+=ddy/d*k*.7}}
  if(S){let cx=0,cy=0,n=0,ax=0,ay=0;for(const g of S.m){if(g===f)continue;cx+=g.x;cy+=g.y;ax+=g.vx;ay+=g.vy;n++}
    if(n){cx/=n;cy/=n;const d=Math.hypot(cx-f.x,cy-f.y),R=L*3.2;if(d>R*.6){const k=Math.min(1.2,(d-R*.6)/R)*.9;dx+=(cx-f.x)/d*k;dy+=(cy-f.y)/d*k}
      const am=Math.hypot(ax,ay)||1;dx+=ax/am*.35;dy+=ay/am*.2}}
  const dm=Math.hypot(dx,dy)||1;let sp1=spd*(.8+.25*Math.sin(w.t*.3+f.id*3))*(1+f.flick*.9);
  const k=1-Math.exp(-dt*(.85+f.flick));
  f.vx+=(dx/dm*sp1-f.vx)*k;f.vy+=(dy/dm*sp1*.8-f.vy)*k;
  f.x+=f.vx*dt;f.y+=f.vy*dt;

  const cxm=L*.5,hx0=cxm,hx1=W-cxm;
  if(f.x<hx0){f.x=hx0;f.vx=Math.abs(f.vx)*.3;f.clamp++}else if(f.x>hx1){f.x=hx1;f.vx=-Math.abs(f.vx)*.3;f.clamp++}
  if(f.y<top){f.y=top;f.vy=Math.abs(f.vy)*.3;f.clamp++}else if(f.y>bot){f.y=bot;f.vy=-Math.abs(f.vy)*.3;f.clamp++}
  /* facing */

}
function fishFlick(f,w){f.flick=1;f.vx+=f.facT*f.sp.spd*U*.6;

    per:rnd(2.8,4.2),ph:rnd(0,TAU),vx:0,vy:0,tilt:0,ty:0,tt:0,flick:0,id:rnd(0,100),nt:o.nt||11,sc:1,clamp:0,t0:rnd(0,50)};

function jellyUpdate(j,dt,w){

  j.ph+=dt*TAU/j.per*(1+j.flick*.6);
  const th=Math.max(0,Math.sin(j.ph));
  const need=clamp((j.y-j.ty)/(H*.25)+.45,0,1.6);
  j.vy+=-th*(dt*74*U)*need*(1+j.flick*.8);j.vy+=dt*14*U;j.vy*=Math.exp(-dt*1.3);
  const tvx=Math.sin(w.t*.11+j.id)*9*U;let wx=0;const m=Math.max(W*.1,r*1.6);
  if(j.x<m)wx=(1-j.x/m)*22*U;else if(j.x>W-m)wx=-(1-(W-j.x)/m)*22*U;
  j.vx+=((tvx+wx)-j.vx)*(1-Math.exp(-dt*.6));

  if(j.y<top){j.y=top;j.vy=Math.abs(j.vy)*.3;j.clamp++}if(j.y>bot){j.y=bot;j.vy=-Math.abs(j.vy)*.3;j.clamp++}

/* ---------- plants (dynamic) ---------- */
const BX=new Float32Array(10),BY=new Float32Array(10);

    const nd=(fx,h,l,c)=>w.plants.push(stemPlant({fx,h,type:'needle',stem:'#4a9a3a',leaf:c||'#6ad24a',sw:1,layer:l}));
    nd(.86,260,0);nd(.9,190,1,'#7ad84a');nd(.55,210,0,'#5ac040');nd(.2,200,0,'#5ac040');nd(.4,150,0,'#78d84a');
    w.plants.push(anubiasPlant({fx:.58,fy:this.fl(.58)-.073,n:5,s:60,layer:1}),anubiasPlant({fx:.37,fy:this.fl(.37)-.024,n:4,s:44,layer:1}),anubiasPlant({fx:.66,fy:this.fl(.66)-.06,n:4,s:40,layer:1}));
    w.cr.push(mkFish(w,'gourami',{y:.3,z:.9}),mkFish(w,'oto',{y:.7,z:1,floor:1,x:.5}));
    school(w,'neon',6,{x:.45,y:.45});
    w.cr.push(mkCrawl(w,'shrimp',{x:.3,z:.98,dy:-1,sc:1.35,bx:[.1,.9],cc:'#e8412e'}),mkCrawl(w,'shrimp',{x:.6,z:.98,dy:-1,sc:1.15,bx:[.4,.95],cc:'#d63a2a'}));
  }});

/* ---------- world ---------- */
let world=null;
const worlds=[];let cur=0,fade=null;
function layout(w){
  const th=w.th;w.surfY=th.surf*H;w.top=w.surfY+H*(th.surf?.045:.07);
  let fm=1;for(let i=0;i<=24;i++)fm=Math.min(fm,th.fl(i/24));
  w.floorMin=fm*H;w.bot=(th.botFrac||(fm-.04))*H;
}
function makeWorld(i){
  const th=THEMES[i];
  const w={i,th,cr:[],plants:[],bub:[],dust:[],rays:[],t:rnd(0,100),surfY:0,top:0,bot:0,floorMin:0,bg:null,fg:null,air:{t:0,burst:0,gap:rnd(.3,1.5)},snd:0,
    floorAt:x=>th.fl(clamp(x/W,0,1))*H,
    bubble(x,y,r,quiet){if(w.bub.length>80)return;w.bub.push({x,y,r,vy:rnd(40,70)*U*(.8+r/(4*U)*.5),ph:rnd(0,TAU),wob:rnd(5,12)*U,q:quiet})}};
  layout(w);world=w;world_floor=w.floorAt;
  th.populate(w);
  w.cr.sort((a,b)=>a.z-b.z);
  for(let k=0;k<th.dust.n;k++)w.dust.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,1.8),ph:rnd(0,TAU),sp:rnd(.5,1.2),a:rnd(.2,1)});
  for(let k=0;k<th.ray.n;k++)w.rays.push({x:(k+rnd(.1,.9))/th.ray.n,w:rnd(26,80),ph:rnd(0,TAU),sp:rnd(.08,.2),sl:rnd(.12,.3),a:rnd(.5,1)});
  return w;
}
function getWorld(i){return worlds[i]||(worlds[i]=makeWorld(i))}
function ensureBG(w){
  if(w.bg)return;
  w.bg=mk(W*DPR,H*DPR);w.fg=mk(W*DPR,H*DPR);
  const b=w.bg.getContext('2d'),f=w.fg.getContext('2d');b.setTransform(DPR,0,0,DPR,0,0);f.setTransform(DPR,0,0,DPR,0,0);
  world=w;world_floor=w.floorAt;
  w.th.build(b,f,mulberry(1234+w.i*77));
}
function evictBG(){for(let i=0;i<worlds.length;i++){const w=worlds[i];if(w&&i!==cur&&!(fade&&fade.from===i)){w.bg=null;w.fg=null}}}

function updateWorld(w,dt){
  w.t+=dt;world=w;world_floor=w.floorAt;
  for(const c of w.cr){c.kind==='fish'?fishUpdate(c,dt,w):c.kind==='jelly'?jellyUpdate(c,dt,w):crawlUpdate(c,dt,w)}
  for(const p of w.plants)if(p.upd)p.upd(dt,w);
  /* bubbles */
  const a=w.air,th=w.th;
  if(th.air){
    if(a.burst>0){a.t-=dt;if(a.t<=0){a.t=rnd(.1,.34);a.burst--;const x=th.air.fx*W+rnd(-1,1)*2*U,y=w.floorAt(x)-2*U;w.bubble(x,y,rnd(1.6,4.2)*U*(th.air.quiet?.7:1),!!a.quietNext);if(a.first){a.first=false;bloop()}}}
    else{a.gap-=dt;if(a.gap<=0){a.burst=rint(3,8);a.gap=rnd(2,6.5);a.first=Math.random()<.7;a.t=0}}
  }
  for(let i=w.bub.length-1;i>=0;i--){const b=w.bub[i];b.y-=b.vy*dt;b.x+=Math.sin(b.ph+b.y*.045)*b.wob*dt;b.r+=dt*.12*U;if(b.y<w.surfY+b.r+2)w.bub.splice(i,1)}
  const fall=th.dust.vy*U;
  for(const d of w.dust){d.x+=(Math.sin(w.t*.25*d.sp+d.ph)*5+3)*U*dt*.6;d.y+=(fall+Math.cos(w.t*.2*d.sp+d.ph)*3*U)*dt;
    if(d.y<w.surfY)d.y=H;if(d.y>H)d.y=w.surfY;if(d.x>W+4)d.x=-4;if(d.x<-4)d.x=W+4}
}
function renderWorld(c,w,t){
  const th=w.th;world=w;world_floor=w.floorAt;ensureBG(w);
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.drawImage(w.bg,0,0,W,H);
  /* rays */
  c.save();c.globalCompositeOperation='lighter';
  const R=th.ray,top=w.surfY;
  for(const r of w.rays){
    const x0=r.x*W+Math.sin(t*r.sp+r.ph)*W*.05,tw=r.w*U*(1+.25*Math.sin(t*.2+r.ph)),sl=r.sl+Math.sin(t*.07+r.ph)*.04,len=H*.86,ex=x0+sl*len;
    const al=R.a*r.a*(.55+.45*Math.sin(t*.3+r.ph*2));
    c.fillStyle=lg(c,x0,top,ex,top+len,[0,rgba(R.col,al),.6,rgba(R.col,al*.3),1,rgba(R.col,0)]);
    c.beginPath();c.moveTo(x0-tw*.5,top);c.lineTo(x0+tw*.5,top);c.lineTo(ex+tw*1.4,top+len);c.lineTo(ex-tw*.5,top+len);c.closePath();c.fill();
  }
  c.restore();
  /* caustics */
  if(th.caus>0){
    if(fade||(frameNo&1)===0){
    const s1=1.7*U,s2=2.5*U;clx.globalCompositeOperation='source-over';clx.globalAlpha=1;clx.clearRect(0,0,W,H);
    causPat.setTransform(new DOMMatrix([s1,0,0,s1,t*9*U,t*5*U]));clx.fillStyle=causPat;clx.fillRect(0,0,W,H);
    causPat2.setTransform(new DOMMatrix([s2,0,0,s2,-t*6*U,t*8*U]));clx.globalAlpha=.8;clx.fillStyle=causPat2;clx.fillRect(0,0,W,H);
    clx.globalAlpha=1;clx.globalCompositeOperation='destination-in';clx.fillStyle=lg(clx,0,w.surfY,0,H,[0,'rgba(0,0,0,1)',.45,'rgba(0,0,0,.4)',.78,'rgba(0,0,0,.75)',1,'rgba(0,0,0,.25)']);clx.fillRect(0,0,W,H);}
    c.globalAlpha=th.caus;c.drawImage(CL,0,0,W,H);c.globalAlpha=1;
  }
  for(const p of w.plants)if(p.layer===0)p.draw(c,t);
  /* air stone */
  if(th.air&&th.air.stone){const x=th.air.fx*W,y=w.floorAt(x);c.fillStyle=lg(c,x-7*U,y-6*U,x+7*U,y+2*U,[0,'#9aa0a8',1,'#4a5058']);c.beginPath();c.ellipse(x,y-1*U,7*U,4.5*U,0,0,TAU);c.fill()}
  /* creatures */
  for(const k of w.cr){
    const a=.82+.18*clamp((k.z-.7)/.3,0,1);c.globalAlpha=a;
    if(k.kind==='fish'){k.sp.draw?k.sp.draw(c,k,t,U):drawFish(c,k,t,U)}else if(k.kind==='jelly')drawJelly(c,k,t,U);else drawCrawl(c,k,t,U);
  }
  c.globalAlpha=1;
  for(const p of w.plants)if(p.layer===1)p.draw(c,t);
  c.drawImage(w.fg,0,0,W,H);
  /* bubbles */
  if(w.bub.length){
    c.fillStyle='rgba(255,255,255,.1)';c.strokeStyle='rgba(255,255,255,.62)';c.lineWidth=1;c.beginPath();
    for(const b of w.bub){c.moveTo(b.x+b.r,b.y);c.arc(b.x,b.y,b.r,0,TAU)}c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,.85)';c.beginPath();for(const b of w.bub){c.moveTo(b.x-b.r*.3+b.r*.28,b.y-b.r*.38);c.arc(b.x-b.r*.3,b.y-b.r*.38,b.r*.26,0,TAU)}c.fill();
  }
  /* dust */
  c.fillStyle='rgba(255,255,255,'+th.dust.a*.5+')';c.beginPath();
  for(const d of w.dust){const r=d.r*U*(.8+.3*Math.sin(t*d.sp+d.ph));c.moveTo(d.x+r,d.y);c.arc(d.x,d.y,r,0,TAU)}c.fill();
  /* surface */
  const sy=w.surfY;
  if(sy>0){
    c.fillStyle=lg(c,0,sy,0,sy+H*.06,[0,'rgba(255,255,255,.4)',1,'rgba(255,255,255,0)']);c.fillRect(0,sy,W,H*.06);
    c.lineWidth=1.6;c.lineJoin='round';
    for(let k=0;k<3;k++){c.strokeStyle='rgba(255,255,255,'+(k?.25:.8)+')';c.beginPath();for(let x=0;x<=W+10;x+=W/36){const y=sy+k*3*U+Math.sin(x*.03+t*(1.1+k*.3)+k)*1.4+Math.sin(x*.07-t*.9)*.8;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
  }else{
    c.fillStyle=lg(c,0,0,0,H*.1,[0,'rgba(255,255,255,.42)',.5,'rgba(255,255,255,.12)',1,'rgba(255,255,255,0)']);c.fillRect(0,0,W,H*.1);
    c.lineWidth=1.5;for(let k=0;k<3;k++){c.strokeStyle='rgba(255,255,255,'+(.22-k*.05)+')';c.beginPath();for(let x=0;x<=W+10;x+=W/32){const y=(10+k*9)*U+Math.sin(x*.025+t*(1+k*.3)+k*2)*3*U+Math.sin(x*.06-t*.8)*1.5*U;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
  }
}

/* ---------- sizing ---------- */
function resize(){
  const vw=Math.max(200,innerWidth),vh=Math.max(200,innerHeight);
  let d=Math.min(window.devicePixelRatio||1,2);const mp=3.2e6;if(vw*vh*d*d>mp)d=Math.sqrt(mp/(vw*vh));
  const oW=W,oH=H;W=vw;H=vh;DPR=d;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);
  buf.width=cv.width;buf.height=cv.height;bctx=buf.getContext('2d',{alpha:false});
  CL.width=Math.max(2,Math.round(W*d*.5));CL.height=Math.max(2,Math.round(H*d*.5));clx=CL.getContext('2d');clx.setTransform(d*.5,0,0,d*.5,0,0);
  causPat=clx.createPattern(CAUS,'repeat');causPat2=clx.createPattern(CAUS,'repeat');
  U=clamp(Math.sqrt(W*H)/620,.55,2.4);
  if(oW){const kx=W/oW,ky=H/oH;
    for(const w of worlds){if(!w)continue;
      for(const c of w.cr){c.x*=kx;if(c.y!=null)c.y*=ky;if(c.py!=null)c.py*=ky}
      for(const b of w.bub){b.x*=kx;b.y*=ky}for(const q of w.dust){q.x*=kx;q.y*=ky}
      layout(w);w.bg=null;w.fg=null}}
}

/* ---------- sound ---------- */
let AC=null,master=null,wantSound=false,lastBloop=0;
try{wantSound=localStorage.getItem('aquarium.sound')==='1'}catch(e){}
function audioInit(){
  if(AC)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  AC=new A();master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const len=AC.sampleRate*3,bufr=AC.createBuffer(1,len,AC.sampleRate),d=bufr.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const wn=Math.random()*2-1;last=(last+.02*wn)/1.02;d[i]=last*3.5}
  const src=AC.createBufferSource();src.buffer=bufr;src.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;const g=AC.createGain();g.gain.value=.05;
  src.connect(lp);lp.connect(g);g.connect(master);src.start();
}
function applySound(){
  const b=document.getElementById('snd');b.classList.toggle('on',wantSound);
  if(wantSound){audioInit();if(AC){AC.resume&&AC.resume();master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(.9,AC.currentTime+.8)}}
  else if(AC){master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(0,AC.currentTime+.4)}
}
function bloop(){
  if(!wantSound||!AC||AC.state!=='running')return;const now=AC.currentTime;if(now-lastBloop<.09)return;lastBloop=now;
  const o=AC.createOscillator(),g=AC.createGain(),f0=rnd(320,820);o.type='sine';
  o.frequency.setValueAtTime(f0,now);o.frequency.exponentialRampToValueAtTime(f0*rnd(1.9,2.7),now+.09);
  g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(rnd(.03,.06),now+.008);g.gain.exponentialRampToValueAtTime(.0006,now+.16);
  o.connect(g);g.connect(master);o.start(now);o.stop(now+.18);
}

/* ---------- UI ---------- */
const nameEl=document.getElementById('name'),dotsEl=document.getElementById('dots'),sndEl=document.getElementById('snd');
let nameTimer=0;
function showName(){nameEl.textContent=THEMES[cur].name;nameEl.classList.add('show');clearTimeout(nameTimer);nameTimer=setTimeout(()=>nameEl.classList.remove('show'),2400)}
THEMES.forEach((th,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',th.name);b.addEventListener('pointerdown',e=>e.stopPropagation());b.addEventListener('click',e=>{e.stopPropagation();go(i)});dotsEl.appendChild(b)});
function updDots(){[...dotsEl.children].forEach((b,i)=>b.classList.toggle('on',i===cur))}
function go(i){
  i=(i+THEMES.length)%THEMES.length;if(i===cur)return;
  const from=cur;cur=i;getWorld(i);
  fade={from,t:0,dur:1.6};showName();updDots();
  try{localStorage.setItem('aquarium.theme',String(i))}catch(e){}
  setTimeout(()=>{ensureBG(getWorld((cur+1)%THEMES.length))},2200);
}
sndEl.addEventListener('pointerdown',e=>e.stopPropagation());
sndEl.addEventListener('click',e=>{e.stopPropagation();wantSound=!wantSound;try{localStorage.setItem('aquarium.sound',wantSound?'1':'0')}catch(err){}applySound()});

/* ---------- input ---------- */
function hit(px,py){
  const w=worlds[cur];let best=null,bd=1e9;
  for(const k of w.cr){let cx=k.x,cy=k.y,r;
    if(k.kind==='fish')r=fishRadius(k);else if(k.kind==='jelly'){r=k.r*U*1.05;cy=k.y+k.r*U*.2}else{r=k.L*U*k.sc*.5;cy=k.y-k.L*U*.15}
    const d=Math.hypot(px-cx,py-cy);if(d<r&&d/r<bd){bd=d/r;best=k}}
  return best;
}
function tap(px,py){
  const w=worlds[cur],k=fade?null:hit(px,py);
  if(k){
    if(k.kind==='fish')fishFlick(k,w);
    else if(k.kind==='jelly'){k.flick=1;for(let i=0;i<2;i++)w.bubble(k.x+rnd(-.5,.5)*k.r*U,k.y+k.r*U*.3,rnd(1.5,2.6)*U,true)}
    else{k.flick=1;k.state='walk';k.t=2}
    bloop();return;
  }
  go(cur+1);
}
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId};if(wantSound&&!AC)applySound();else if(AC&&AC.state==='suspended')AC.resume()});
cv.addEventListener('pointerup',e=>{
  if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y,dt=performance.now()-pd.t;pd=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){go(cur+(dx<0?1:-1));return}
  if(Math.hypot(dx,dy)<14&&dt<700)tap(e.clientX,e.clientY);
});
cv.addEventListener('pointercancel',()=>{pd=null});
let idleT=0;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500)}
window.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')wake()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){go(cur+1);e.preventDefault()}else if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='m'||e.key==='M')sndEl.click();else if(/^[1-9]$/.test(e.key)&&+e.key<=THEMES.length)go(+e.key-1)});
['gesturestart','gesturechange','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
let frameNo=0,raf=0,last=0,stats={n:0,ms:0,max:0,upd:0,drw:0};
function step(dt){
  const w=worlds[cur];updateWorld(w,dt);
  if(fade){updateWorld(worlds[fade.from],dt);fade.t+=dt;if(fade.t>=fade.dur){fade=null;evictBG()}}
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);const w=worlds[cur];
  if(fade){
    bctx.setTransform(DPR,0,0,DPR,0,0);renderWorld(bctx,worlds[fade.from],worlds[fade.from].t);
    renderWorld(ctx,w,w.t);ctx.globalAlpha=1-sstep(fade.t/fade.dur);ctx.drawImage(buf,0,0,W,H);ctx.globalAlpha=1;
  }else renderWorld(ctx,w,w.t);
}
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!last){last=ts;return}
  const el=ts-last;if(el<14)return;last=ts;
  const dt=Math.min(el/1000,.05);
  frameNo++;const t0=performance.now();step(dt);const t1=performance.now();render();const t2=performance.now();
  stats.n++;stats.ms+=t2-t0;stats.upd+=t1-t0;stats.drw+=t2-t1;stats.max=Math.max(stats.max,t2-t0);
}
function start(){if(!raf){last=0;raf=requestAnimationFrame(frame)}}
function stop(){cancelAnimationFrame(raf);raf=0}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(AC&&AC.state==='running')AC.suspend()}else{start();if(wantSound&&AC)AC.resume()}});
window.addEventListener('pagehide',stop);window.addEventListener('pageshow',()=>{if(!document.hidden)start()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ---------- init ---------- */
resize();
try{const s=+localStorage.getItem('aquarium.theme');if(s>=0&&s<THEMES.length)cur=s}catch(e){}
if(/[?&]theme=(\d)/.test(location.search))cur=Math.min(THEMES.length-1,+RegExp.$1);
getWorld(cur);ensureBG(worlds[cur]);
for(let i=0;i<120;i++)updateWorld(worlds[cur],1/30);   // settle initial motion
updDots();applySound();showName();wake();
start();

/* test / debug hooks (harmless) */
window.__aq={themes:THEMES.map(t=>t.name),cur:()=>cur,go,stats,reset:()=>{stats.n=stats.ms=stats.upd=stats.drw=stats.max=0},
  size:()=>({W,H,DPR,U}),tap,
  advance(n,dt){const w=worlds[cur];for(let i=0;i<n;i++)updateWorld(w,dt||1/60)},
  report(){const w=worlds[cur];let n=0,out=0,cl=0,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for(const c of w.cr){if(c.kind==='crawl'){if(c.y<w.floorMin-14*U||c.y>H)out++;continue}n++;if(c.x<0||c.x>W||c.y<w.surfY||c.y>H)out++;cl+=c.clamp||0;c.clamp=0;minx=Math.min(minx,c.x);maxx=Math.max(maxx,c.x);miny=Math.min(miny,c.y);maxy=Math.max(maxy,c.y)}
    return{count:w.cr.length,swimmers:n,out,clampHits:cl,minx,maxx,miny,maxy,W,H,top:w.top,bot:w.bot}},
  settle(){fade=null;evictBG()},pos:()=>worlds[cur].cr.map(c=>({k:c.kind,x:c.x,y:c.y,r:c.kind==='fish'?fishRadius(c):30})),fading:()=>!!fade,cr:()=>worlds[cur].cr,hidden:()=>raf===0};
})();
</script>
</body>
